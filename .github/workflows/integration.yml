name: Integration Tests

on:
  # Nightly at 02:00 UTC — catches regressions before the morning
  schedule:
    - cron: '0 2 * * *'

  # Pre-deploy gate — runs on every PR targeting main
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  integration:
    name: Socket-level integration tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: govauctionplatform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: govauctionplatform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ github.run_id }}
          path: govauctionplatform/integration-results.xml
          if-no-files-found: ignore
          retention-days: 14
